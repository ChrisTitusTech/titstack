approval_policy = "never"
# Astra balance baseline; rationale and task-specific overrides: docs/ASTRA.md.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
sandbox_mode = "danger-full-access"

[features]
fast_mode = false
memories = false

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch"]
status_line_use_colors = true

[desktop]
followUpQueueMode = "queue"

[windows]
sandbox = "elevated"

# Available in ordinary CLI and desktop sessions; install photocraft-cli on PATH.
# Keep startup optional on machines without PhotoCraft. The dedicated profile
# makes this server required. File access remains scoped to the startup directory.
[mcp_servers.photocraft]
command = "photocraft-cli"
args = ["mcp", "--automation-read-root", ".", "--automation-write-root", "."]
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
